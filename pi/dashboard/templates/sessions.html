{% extends "base.html" %}
{% block title %}Sessions{% endblock %}
{% block content %}
<section class="panel"><header class="panel-heading"><div><h2>Connection ledger</h2><p><span id="session-ledger-count">{{ sessions|length }}</span> recent routed sessions</p></div><a href="{{ url_for('honeypot_page') }}">Decoy overview</a></header><div class="filters"><input id="session-ip-filter" placeholder="Exact source IP…" aria-label="Filter session source IP"><select id="backend-filter" aria-label="Filter session backend"><option value="">All backends</option><option value="real">Real broker</option><option value="decoy">Decoy broker</option></select><span class="status-line">Latest 500 matching sessions · updates automatically</span></div></section>
<section class="panel"><div class="table-wrap"><table class="sortable"><thead><tr><th data-sort>Source IP</th><th data-sort>Backend</th><th data-sort>Profile</th><th data-sort>Start</th><th data-sort>End</th><th data-sort>Duration</th></tr></thead><tbody id="session-ledger"></tbody></table></div></section>
<script id="initial-sessions" type="application/json">{{ sessions|tojson }}</script>
{% endblock %}
