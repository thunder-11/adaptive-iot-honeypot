{% extends "base.html" %}
{% block title %}Events & Alerts{% endblock %}
{% block content %}
<section class="panel"><header class="panel-heading"><div><h2>Event log</h2><p><span id="visible-count">{{ events|length }}</span> loaded of <span id="matching-count">{{ events|length }}</span> matching signals · <span id="stream-state">streaming</span></p></div><div class="toolbar"><button class="button" id="pause-stream" type="button" aria-pressed="false">Ⅱ Pause stream</button><a class="button" href="{{ url_for('alerts_page') }}">Security alerts</a><a class="button" id="filtered-export" href="{{ url_for('export_events_csv') }}">↓ Export CSV</a><a class="button" href="{{ url_for('export_evidence_zip') }}">Full evidence ZIP</a><button class="button danger" id="clear-logs" type="button">Clear logs + scores</button></div></header><div class="filters"><input id="ip-filter" placeholder="Exact source IP…" aria-label="Filter source IP"><select id="category-filter" aria-label="Filter category"><option value="">All categories</option></select><select id="action-filter" aria-label="Filter action"><option value="">All actions</option><option value="allow">Allow</option><option value="throttle">Throttle</option><option value="restrict">Restrict</option><option value="decoy">Redirect to decoy</option></select><select id="risk-filter" aria-label="Filter risk"><option value="">All risks</option><option>LOW</option><option>MEDIUM</option><option>HIGH</option><option>CRITICAL</option></select><select id="time-filter" aria-label="Filter time"><option value="0">All time</option><option value="300">Last 5 minutes</option><option value="3600">Last hour</option><option value="86400">Last day</option></select><span class="status-line live-dot" id="stream-indicator">● live</span></div></section>
<section class="panel"><div class="table-wrap"><table><thead><tr><th>Time</th><th>Source IP</th><th>Category</th><th>Signal</th><th>Pts</th><th>Score</th><th>Action</th><th>Detail</th></tr></thead><tbody id="events-body"></tbody></table></div></section>
<div class="toolbar pagination-controls"><button class="button" id="load-more-events" type="button" hidden>Load older events</button><span class="status-line" id="event-load-status" role="status"></span></div>
<script id="initial-events" type="application/json">{{ events|tojson }}</script>
{% endblock %}
